[project]
name = "stock-analysis"
version = "0.1.0"
description = "Stock analysis MVP for extreme volume contraction signals"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "supabase",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv",
    "opencv-python",
    "pytesseract",
    "requests",
    "flask",
    "flask-cors",
    "akshare>=1.10.0",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.6.1",
    "networkx>=3.4.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
