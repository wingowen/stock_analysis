[project]
name = "stock-analysis"
version = "0.1.0"
description = "Stock analysis MVP for extreme volume contraction signals"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "supabase",
    "pandas==1.3.5",
    "numpy==1.26.4",
    "python-dotenv",
    "opencv-python",
    "pytesseract",
    "pyeastmoney",
    "requests",
    "flask",
    "flask-cors",
    "akshare==1.18.19",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.6.1",
    "networkx>=3.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
